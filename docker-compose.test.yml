version: "3.8"

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bta_test
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bta_test"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - default

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - default

  minio-create-bucket:
    image: minio/mc:latest
    profiles: ["setup"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin
        /usr/bin/mc mb --ignore-existing myminio/bta-storage-test
        /usr/bin/mc anonymous set none myminio/bta-storage-test
        /usr/bin/mc stat myminio/bta-storage-test
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://bta_app:bta_app_password@postgres:5432/bta_test?schema=public
      - DATABASE_ADMIN_URL=postgresql://postgres:postgres@postgres:5432/bta_test?schema=public
      - STORAGE_BACKEND=postgres
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=bta-storage-test
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - PARSER_SANDBOX_URL=http://parser-sandbox:8080/parse
      - PORT=3000
      - NODE_ENV=test
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio-create-bucket
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/well-known/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/workers/index.js"]
    environment:
      - DATABASE_URL=postgresql://bta_app:bta_app_password@postgres:5432/bta_test?schema=public
      - STORAGE_BACKEND=postgres
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=bta-storage-test
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_FORCE_PATH_STYLE=true
      - NODE_ENV=test
    depends_on:
      - postgres
      - minio-create-bucket
    networks:
      - default

  parser-sandbox:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.parser
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sandbox_net

networks:
  default:
    name: bta_test_net
  sandbox_net:
    internal: true

volumes:
  minio_data:
