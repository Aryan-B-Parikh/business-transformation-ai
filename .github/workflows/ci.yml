name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Gate 1 — Repository Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test-unit:
    name: Gate 2 — Unit Tests (Monorepo)
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test

  test-integration:
    name: Gate 3 — Integration & PRD Matrix
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: cd apps/api && npx vitest run tests/prd-coverage.test.ts tests/rls.test.ts

  test-security:
    name: Gate 4 — Security, Dependencies & Secrets
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-e2e:
    name: Gate 5 — True Golden Path, RLS & E2E Verification
    needs: [test-unit, test-integration, test-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Start Infrastructure
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml --profile setup up minio-create-bucket
      - name: Verify Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Run E2E & True Golden Path Tests
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
          PARSER_SANDBOX_URL: http://localhost:8080/parse
          API_URL: http://localhost:3000
        run: |
          cd apps/api
          npx vitest run tests/e2e/
          npx vitest run tests/goldenPath.e2e.test.ts
      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  release-gate:
    name: 10/10 Enterprise Release Gate
    needs: [test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsx scripts/verify-release-gate.ts
