name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Gate 1 — Repository Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Typecheck (explicit, no emit — satisfies Phase 35 gate)
        run: npx tsc --noEmit --project apps/api/tsconfig.json && npx tsc --noEmit --project apps/web/tsconfig.json && npx tsc --noEmit --project apps/mobile/tsconfig.json

  test-unit:
    name: Gate 2a — Unit Tests (Monorepo, no infra)
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test --workspaces --if-present
      - name: API unit tests (in-memory repos only)
        run: cd apps/api && npx vitest run --exclude "**/*.e2e.test.ts" tests/

  test-integration:
    name: Gate 2b — Integration Tests (Postgres + MinIO + Parser)
    needs: [validate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bta_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: [9000:9000]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Create bta_app role (least privilege for test — NOBYPASSRLS, RLS via current_org_id)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bta_app') THEN
              CREATE ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            ELSE
              ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          REVOKE ALL PRIVILEGES ON DATABASE bta_test FROM bta_app;
          GRANT CONNECT ON DATABASE bta_test TO bta_app;
          GRANT USAGE, CREATE ON SCHEMA public TO bta_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO bta_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO bta_app;
          SQL
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password';"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;"
          echo "Verifying bta_app can connect..."
          PGPASSWORD=bta_app_password psql -h localhost -U bta_app -d bta_test -c "SELECT 1 as ok;"
      - name: Create MinIO bucket (single container, alias+mb atomically)
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/bta-storage-test &&
            mc anonymous set none local/bta-storage-test
          '
      - name: Run integration + PRD matrix + RLS (hermetic — no parser, parser tests are in E2E)
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
        run: |
          cd apps/api
          npx vitest run tests/prd-coverage.test.ts tests/rls.test.ts tests/crossTenantAttack.test.ts tests/concurrency-artifact.test.ts

  test-security:
    name: Gate 4 — Security, Dependencies & Secrets (Strict)
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: node scripts/security-audit.cjs
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Secret scan (strict, fails CI on any leak)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-e2e:
    name: Gate 5 — True Golden Path, RLS & E2E Verification
    needs: [test-unit, test-integration, test-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: "Build API image (no cache)"
        run: docker compose -f docker-compose.test.yml build --no-cache api
      - name: "Start Infrastructure (deterministic: postgres -> minio -> bucket -> parser -> api -> worker)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml ps -a
      - name: Verify Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Grant bta_app permissions on migrated tables
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, CREATE ON SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;"
      - name: Wait for API ready
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000/readyz && echo " API ready" && break || echo " waiting... ($i)" ; sleep 2; done
          curl -sf http://localhost:3000/readyz || (echo "API not ready after 60s" && docker compose -f docker-compose.test.yml logs api && exit 1)
      - name: Verify bta_app can query users table
        env:
          PGPASSWORD: bta_app_password
        run: |
          psql -h localhost -U bta_app -d bta_test -c "SELECT count(*) FROM users;" 2>&1 || echo "bta_app cannot query users table"
      - name: Run E2E & True Golden Path Tests
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
          PARSER_SANDBOX_URL: http://localhost:8080/parse
          API_URL: http://localhost:3000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: |
          cd apps/api
          npx vitest run tests/e2e/
          npx vitest run tests/goldenPath.e2e.test.ts
      - name: Dump API container logs (debug)
        if: always()
        run: docker compose -f docker-compose.test.yml logs api
      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  test-load:
    name: Gate 6 — Load, SLO & DR Verification
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bta_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Migrate and seed test DB (consistent with E2E — exact least privilege per docker/init-test-db.sql)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: |
          cd apps/api
          npx prisma migrate deploy
          # Create restricted bta_app exactly as docker/init-test-db.sql — least privilege, NOSUPERUSER, NOBYPASSRLS, no GRANT ALL
          PGPASSWORD=postgres psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bta_app') THEN
              CREATE ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            ELSE
              ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          REVOKE ALL PRIVILEGES ON DATABASE bta_test FROM bta_app;
          GRANT CONNECT ON DATABASE bta_test TO bta_app;
          GRANT USAGE, CREATE ON SCHEMA public TO bta_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO bta_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO bta_app;
          SQL
          PGPASSWORD=postgres psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password';"
          PGPASSWORD=postgres psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;"
          echo "Verifying bta_app can connect..."
          PGPASSWORD=bta_app_password psql -h localhost -U bta_app -d bta_test -c "SELECT 1 as ok;"
      - name: Run load + DR tests (SLO p95 < 200ms, worker restart survival)
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
        run: |
          cd apps/api
          npx vitest run tests/load.test.ts tests/disasterRecovery.test.ts tests/outboxWorker.test.ts

  release-gate:
    name: 10/10 Enterprise Release Gate (requires all mandatory gates)
    needs: [test-unit, test-integration, test-security, test-e2e, test-load]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start Live Infrastructure for strict verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml ps -a
          # Wait for API ready
          for i in $(seq 1 30); do curl -sf http://localhost:3000/readyz && break || sleep 2; done
          curl -sf http://localhost:9000/minio/health/live || echo "MinIO not yet ready"
      - name: Verify Migrations on live DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Strict 10/10 verification — live infra required, no fallback
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          S3_ENDPOINT: http://localhost:9000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: npx tsx scripts/verify-release-gate.ts --strict
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
