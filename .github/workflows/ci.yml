name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate (Lint & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  test-unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: cd apps/api && npx prisma generate && npx vitest run -c vitest.unit.config.ts

  test-e2e:
    name: E2E, RLS & Migration Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Start Infrastructure
        run: |
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml --profile setup up minio-create-bucket
      - name: Verify Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: npx prisma migrate deploy
      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          PARSER_SANDBOX_URL: http://localhost:8080/parse
        run: |
          npx vitest run tests/e2e/
          npx vitest run tests/goldenPath.e2e.test.ts
      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  security:
    name: Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high || true
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
