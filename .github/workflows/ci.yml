name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Gate 1 — Repository Integrity & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Typecheck project graph
        run: npx tsc --build tsconfig.json --force --pretty false

  test-unit:
    name: Gate 2a — Unit Tests
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test --workspaces --if-present
      - run: cd apps/api && npx vitest run tests/*.test.ts --exclude "**/e2e/**" --exclude "**/*.e2e.test.ts"

  test-integration:
    name: Gate 2b — Integration Tests
    needs: [validate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bta_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d bta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: [9000:9000]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 10
        command: server /data --console-address ":9001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Migrate database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Configure restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bta_app') THEN
              CREATE ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            ELSE
              ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          REVOKE ALL PRIVILEGES ON DATABASE bta_test FROM bta_app;
          GRANT CONNECT ON DATABASE bta_test TO bta_app;
          REVOKE CREATE ON SCHEMA public FROM bta_app;
          GRANT USAGE ON SCHEMA public TO bta_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;
          SQL
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "SELECT rolname FROM pg_roles WHERE rolname='bta_app' AND rolsuper=false AND rolbypassrls=false;" | grep bta_app
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -c 'mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/bta-storage-test && mc anonymous set none local/bta-storage-test'
      - name: Integration, PRD and RLS tests
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
        run: cd apps/api && npx vitest run tests/prd-coverage.test.ts tests/rls.test.ts tests/crossTenantAttack.test.ts tests/concurrency-artifact.test.ts

  test-security:
    name: Gate 4 — Security, Dependencies & Secrets
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: node scripts/security-audit.cjs
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-e2e:
    name: Gate 5 — True Golden Path, RLS & E2E Verification
    needs: [test-unit, test-integration, test-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start test infrastructure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Verify migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
        run: cd apps/api && npx prisma migrate deploy
      - name: Re-apply runtime grants
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;"
      - name: Run E2E suites
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
          PARSER_SANDBOX_URL: http://localhost:8080/parse
          API_URL: http://localhost:3000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: |
          set -euo pipefail
          cd apps/api
          npx vitest run tests/e2e/
          npx vitest run tests/goldenPath.e2e.test.ts
      - name: Teardown infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  test-load:
    name: Gate 6 — Load, SLO & DR Verification
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bta_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d bta_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Migrate and configure restricted role
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          cd apps/api
          npx prisma migrate deploy
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'bta_app') THEN
              CREATE ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            ELSE
              ALTER ROLE bta_app WITH LOGIN PASSWORD 'bta_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END $$;
          REVOKE ALL PRIVILEGES ON DATABASE bta_test FROM bta_app;
          GRANT CONNECT ON DATABASE bta_test TO bta_app;
          REVOKE CREATE ON SCHEMA public FROM bta_app;
          GRANT USAGE ON SCHEMA public TO bta_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;
          SQL
      - name: Load and DR tests
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
        run: cd apps/api && npx vitest run tests/load.test.ts tests/disasterRecovery.test.ts tests/outboxWorker.test.ts

  release-gate:
    name: 10/10 Enterprise Release Gate
    needs: [test-unit, test-integration, test-security, test-e2e, test-load]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start live infrastructure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Verify migrations and restricted role
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          cd apps/api
          npx prisma migrate deploy
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bta_app;"
          psql -h localhost -U postgres -d bta_test -v ON_ERROR_STOP=1 -c "SELECT rolname FROM pg_roles WHERE rolname='bta_app' AND rolsuper=false AND rolbypassrls=false;" | grep bta_app
      - name: Strict release verification
        env:
          DATABASE_URL: postgresql://bta_app:bta_app_password@localhost:5432/bta_test?schema=public
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/bta_test?schema=public
          STORAGE_BACKEND: postgres
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: bta-storage-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: "true"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
        run: npx tsx apps/api/scripts/verify-release-gate.ts --strict
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
